# OpenOCD server only. Connecting does not download firmware or enable PWM.
bindto 127.0.0.1
gdb port 3333
tcl port disabled
telnet port disabled
source [find tools/f103_openocd.cfg]
# The upstream stm32f1x.cfg overrides adapter speed; set it after sourcing.
adapter speed 100
gdb flash_program enable
gdb memory_map enable
