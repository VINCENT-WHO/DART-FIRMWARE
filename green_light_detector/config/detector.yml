%YAML:1.0
---
# 绿色光晕阈值：OpenCV H范围0~179，S/V范围0~255。
hue_min: 35
hue_max: 95
saturation_min: 45
green_value_min: 140
# 白色过曝灯芯仅用亮度检测，再检查其附近是否有绿色光晕。
core_value_min: 240
median_kernel: 3
support_radius: 7
# 面积单位为当前分辨率下的像素平方；小反光点通常达不到80。
area_min: 80.0
area_max_fraction: 0.08
# 使用较宽松形状约束，允许过曝变形、斜视和轻微运动拖影。
aspect_ratio_max: 2.4
circularity_min: 0.35
green_pixels_min: 20
green_fraction_min: 0.08
